[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "BayesMonSTR-ATAC"
version = "0.1.0"
description = "A tool for mosaic STR mutation calling in snATAC-seq data"
authors = [{name = "Weixiang Wang & Chunyi Wang", email = "wangchunyi@westlake.edu.cn"}]
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]


[project.scripts]
bayesmonstr-atac = "cli:app"


[tool.setuptools.packages]
find = {where = ["src"]}


[tool.setuptools.package-dir]
"" = "src"